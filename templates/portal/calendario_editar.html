{% extends "common/base.html" %}
{% load i18n %}
{% load static %}
{% load comentarios_extras %}
{% get_current_language as LANGUAGE_CODE %}
{% block title %}VANDAL{% endblock %}
{% block content %}

  </form>
{% endblock %}
