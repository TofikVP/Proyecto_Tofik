{% extends "common/base.html" %}
{% load i18n %}
{% load static %}
{% block title %}VANDAL{% endblock %}
{% block content %}

  <h2>{% trans "¿Eliminar este post?" %}</h2>
  <p>{{ post.title }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">
      {% trans "Confirmar" %}
    </button>
    
    <button>
      <a style="text-decoration: none;color: white;" href="{% url 'dashboard_redactor' %}">{% trans "Cancelar" %}</a>
    </button>
  </form>
{% endblock %}
